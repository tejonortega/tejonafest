<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invitación Tejona Fest</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 32px 18px 40px;
      position: relative;
      overflow-x: hidden;
      background-color: #042f2e;
      text-align: center;
    }

    /* Foto a pantalla completa */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('foto.jpg.jpg');
      background-size: cover;
      background-position: center top;
      z-index: 1;
    }

    /* Capa suave para que el texto resalte sin tapar la foto */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(0, 0, 0, 0.65) 0%,
        rgba(0, 0, 0, 0.15) 45%,
        rgba(0, 0, 0, 0.75) 100%
      );
      z-index: 2;
    }

    /* Contenido flotante directo sobre la foto */
    .header-content,
    .footer-content {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 380px;
    }

    .badge {
      display: inline-block;
      background: rgba(15, 118, 110, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 8px 18px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    h1 {
      margin: 0 0 10px;
      color: #2dd4bf;
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
    }

    .info-pill {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 12px;
    }

    .location {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .date {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .note {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f0fdfa;
      background: rgba(13, 148, 136, 0.8);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 8px 16px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .countdown-box {
      background: rgba(255, 255, 255, 0.92);
      border: 2px dashed #0d9488;
      border-radius: 16px;
      padding: 14px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .countdown-box span {
      font-size: 1.35rem;
      font-weight: 900;
      color: #0f766e;
      letter-spacing: 0.5px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Foto de fondo completa -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <!-- Parte superior: Título del evento -->
  <div class="header-content">
    <div class="badge">Estás invitado al</div>
    <h1>Tejona Fest</h1>
  </div>

  <!-- Parte inferior: Detalles y Contador -->
  <div class="footer-content">
    <div class="info-pill">
      <div class="location">📍 Muelle municipal</div>
      <div class="date">📅 23 / 01 / 27</div>
    </div>
    <div class="note">🧺 Trae algo para compartir</div>

    <div class="countdown-box">
      <span id="countdown">Calculando...</span>
    </div>
  </div>

  <script>
    const targetDate = new Date(2027, 0, 23);

    function updateCountdown() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const diffTime = targetDate - today;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      const display = document.getElementById('countdown');
      if (diffDays > 1) {
        display.textContent = `Faltan ${diffDays} días`;
      } else if (diffDays === 1) {
        display.textContent = '¡Falta 1 día!';
      } else if (diffDays === 0) {
        display.textContent = '¡Es hoy!';
      } else {
        display.textContent = '¡El evento ya se celebró!';
      }
    }

    updateCountdown();
  </script>
</body>
</html>
