<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Tejona Fest</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0d9488 0%, #06b6d4 50%, #38bdf8 100%);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 16px 32px rgba(13, 148, 136, 0.35);
      text-align: center;
    }
    .image-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    .content {
      padding: 24px 20px;
    }
    .badge {
      display: inline-block;
      background: #ccfbf1;
      color: #0f766e;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    h1 {
      margin: 4px 0 10px;
      color: #0d9488;
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .location {
      margin: 0 0 6px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
    }
    .date {
      margin: 0 0 14px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #0284c7;
    }
    .note {
      margin: 0 0 20px;
      font-size: 1rem;
      font-weight: 500;
      color: #0f766e;
      background: #f0fdfa;
      padding: 8px 12px;
      border-radius: 10px;
      display: inline-block;
    }
    .countdown-box {
      background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 100%);
      border: 2px dashed #06b6d4;
      border-radius: 16px;
      padding: 14px;
    }
    .countdown-box span {
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f766e;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="image-container">
      <img src="foto.jpg" alt="Tejona Fest Bacalar">
    </div>
    <div class="content">
      <div class="badge">Estás invitado al</div>
      <h1>Tejona Fest</h1>
      <div class="location">📍 Muelle municipal</div>
      <div class="date">📅 23 / 01 / 27</div>
      <div class="note">🧺 Trae algo para compartir</div>

      <div class="countdown-box">
        <span id="countdown">Calculando...</span>
      </div>
    </div>
  </div>

  <script>
    const targetDate = new Date('2027-01-23T00:00:00');

    function updateCountdown() {
      const now = new Date();
      const diffTime = targetDate - now;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      const display = document.getElementById('countdown');
      if (diffDays > 1) {
        display.textContent = `Faltan ${diffDays} días`;
      } else if (diffDays === 1) {
        display.textContent = '¡Falta 1 día!';
      } else if (diffDays === 0) {
        display.textContent = '¡Es hoy!';
      } else {
        display.textContent = '¡El evento ya se llevó a cabo!';
      }
    }

    updateCountdown();
  </script>
</body>
</html>
