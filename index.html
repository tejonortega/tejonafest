<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Tejona Fest</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Imagen de fondo a pantalla completa */
      background: linear-gradient(rgba(10, 37, 48, 0.45), rgba(10, 37, 48, 0.7)),
                  url('foto.jpg.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 28px;
      max-width: 400px;
      width: 100%;
      padding: 36px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .badge {
      display: inline-block;
      background: #0f766e;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 8px 18px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 14px;
      color: #0d9488;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }
    .location {
      margin: 0 0 8px;
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
    }
    .date {
      margin: 0 0 16px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #0284c7;
    }
    .note {
      margin: 0 0 24px;
      font-size: 1rem;
      font-weight: 700;
      color: #134e4a;
      background: #ccfbf1;
      padding: 10px 16px;
      border-radius: 12px;
      display: inline-block;
    }
    .countdown-box {
      background: #ffffff;
      border: 3px dashed #0d9488;
      border-radius: 18px;
      padding: 16px 12px;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.15);
    }
    .countdown-box span {
      font-size: 1.45rem;
      font-weight: 900;
      color: #0f766e;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Estás invitado al</div>
    <h1>Tejona Fest</h1>
    <div class="location">📍 Muelle municipal</div>
    <div class="date">📅 23 / 01 / 27</div>
    <div class="note">🧺 Trae algo para compartir</div>

    <div class="countdown-box">
      <span id="countdown">Calculando...</span>
    </div>
  </div>

  <script>
    const targetDate = new Date(2027, 0, 23);

    function updateCountdown() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const diffTime = targetDate - today;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      const display = document.getElementById('countdown');
      if (diffDays > 1) {
        display.textContent = `Faltan ${diffDays} días`;
      } else if (diffDays === 1) {
        display.textContent = '¡Falta 1 día!';
      } else if (diffDays === 0) {
        display.textContent = '¡Es hoy!';
      } else {
        display.textContent = '¡El evento ya se celebró!';
      }
    }

    updateCountdown();
  </script>
</body>
</html>
