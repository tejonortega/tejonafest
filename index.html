<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Invitación Tejona Fest</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh; /* Altura dinámica exacta para pantallas móviles */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 16px;
      position: relative;
      overflow-x: hidden;
      background-color: #042f2e;
    }

    /* Fondo optimizado para celular */
    .bg-image {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('foto.jpg.jpg');
      background-size: cover;
      background-position: center center;
      z-index: 1;
    }

    /* Capa de contraste para asegurar lectura */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(4, 47, 46, 0.45) 0%, rgba(4, 47, 46, 0.75) 100%);
      z-index: 2;
    }

    /* Tarjeta principal */
    .card {
      position: relative;
      z-index: 3;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      padding: 28px 18px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .badge {
      display: inline-block;
      background: #0f766e;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 10px;
      color: #0d9488;
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .location {
      margin: 0 0 6px;
      font-size: 1.2rem;
      font-weight: 700;
      color: #0f172a;
    }

    .date {
      margin: 0 0 14px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #0284c7;
    }

    .note {
      margin: 0 0 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #115e59;
      background: #ccfbf1;
      padding: 8px 12px;
      border-radius: 10px;
      display: inline-block;
    }

    .countdown-box {
      background: #ffffff;
      border: 2px dashed #0d9488;
      border-radius: 16px;
      padding: 14px 10px;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.12);
    }

    .countdown-box span {
      font-size: 1.3rem;
      font-weight: 900;
      color: #0f766e;
      letter-spacing: 0.5px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Capas de fondo -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <!-- Contenido -->
  <div class="card">
    <div class="badge">Estás invitado al</div>
    <h1>Tejona Fest</h1>
    <div class="location">📍 Muelle municipal</div>
    <div class="date">📅 23 / 01 / 27</div>
    <div class="note">🧺 Trae algo para compartir</div>

    <div class="countdown-box">
      <span id="countdown">Calculando...</span>
    </div>
  </div>

  <script>
    const targetDate = new Date(2027, 0, 23);

    function updateCountdown() {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

      const diffTime = targetDate - today;
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      const display = document.getElementById('countdown');
      if (diffDays > 1) {
        display.textContent = `Faltan ${diffDays} días`;
      } else if (diffDays === 1) {
        display.textContent = '¡Falta 1 día!';
      } else if (diffDays === 0) {
        display.textContent = '¡Es hoy!';
      } else {
        display.textContent = '¡El evento ya se celebró!';
      }
    }

    updateCountdown();
  </script>
</body>
</html>
